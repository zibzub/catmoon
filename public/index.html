<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatMoon</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="CatMoon">
    <meta property="og:description" content="Rotate every MoonCat in your mind.">
    <meta property="og:url" content="https://catmoon.zibzub.art/">
    <meta property="og:image" content="https://catmoon.zibzub.art/img/preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CatMoon">
    <meta name="twitter:description" content="Rotate every MoonCat in your mind.">
    <meta name="twitter:image" content="https://catmoon.zibzub.art/img/preview.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="android-chrome" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <a
      class="corner-control back-control"
      href="https://zibzub.art/"
      aria-label="Back to zibzub.art"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </a>

    <div id="background" aria-hidden="true">
      <div id="small-stars"></div>
      <div id="large-stars"></div>
    </div>
    <canvas id="scene"></canvas>

    <div id="hud" class="locked">
      <button id="hudLockButton" type="button" aria-label="Unlock MoonCat details" title="Unlock MoonCat details">🔒</button>
      <button id="activeFilterBadge" type="button" hidden>
        <span id="activeFilterName"></span>
        <span id="activeFilterReset">Reset Filter</span>
      </button>
      <div id="hudDetails">
        <label id="hoverPreviewControl" for="hoverPreviewToggle">
          <input id="hoverPreviewToggle" type="checkbox" checked>
          Hover preview
        </label>
        <label id="filterControls" for="catFilter">
          Filter
          <select id="catFilter">
            <option value="all">All Cats</option>
            <option value="wallet" hidden>Wallet Cats</option>
            <option value="genesis">Genesis Cats</option>
            <option value="characters">Character Cats</option>
            <option value="day1">Day 1 Rescues</option>
            <option value="week1">Week 1 Rescues</option>
            <option value="2017">2017 Rescues</option>
            <option value="2018">2018 Rescues</option>
            <option value="2019">2019 Rescues</option>
            <option value="2020">2020 Rescues</option>
            <option value="earlyRescues">All Early Rescues</option>
            <option value="2021">2021 Rescues</option>
          </select>
        </label>
        <div id="walletControls">
          <label for="walletFilterInput">Wallet</label>
          <div id="walletFilterRow">
            <div id="walletFilterInputWrap">
              <input id="walletFilterInput" type="text" placeholder="0x... or name.eth" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false" aria-controls="walletHistoryDropdown">
              <button id="walletFilterClear" type="button" aria-label="Clear wallet input" hidden>×</button>
              <div id="walletHistoryDropdown" role="listbox" hidden></div>
            </div>
            <button id="walletFilterButton" type="button">Lookup</button>
          </div>
          <div id="walletFilterStatus" role="status" aria-live="polite"></div>
        </div>
        <div id="status">Drag to rotate. Scroll or pinch to zoom. Click a hovered cat to open its rescue page.</div>
      </div>
    </div>

    <div id="tooltip" aria-hidden="true">
      <div id="tooltipPreview" aria-hidden="true"></div>
      <div id="tooltipLabel"></div>
    </div>
    <div id="loadingOverlay">
      <div id="loadingCard">
        <div id="loadingSpinner"></div>
        <div id="loadingTitle">Loading CatMoon</div>
        <div id="loadingProgress">Preparing faces...</div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
