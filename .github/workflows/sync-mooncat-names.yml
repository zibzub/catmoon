name: Sync MoonCat names

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: mooncat-name-sync-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the target branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync MoonCat names
        run: npm run sync:names

      - name: Verify the repository
        run: |
          npm test
          npm run check

      - name: Commit and push generated names when changed
        shell: bash
        run: |
          set -euo pipefail

          unexpected_changes="$(
            git diff --name-only HEAD -- . ':(exclude)public/data/mooncat-names.json'
            git ls-files --others --exclude-standard
          )"
          if [[ -n "${unexpected_changes}" ]]; then
            echo "Unexpected changes detected outside public/data/mooncat-names.json:"
            printf '%s\n' "${unexpected_changes}"
            exit 1
          fi

          if git diff --quiet HEAD -- public/data/mooncat-names.json; then
            echo "MoonCat names are unchanged; no commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/mooncat-names.json

          staged_files="$(git diff --cached --name-only)"
          if [[ "${staged_files}" != "public/data/mooncat-names.json" ]]; then
            echo "Refusing to commit files other than public/data/mooncat-names.json:"
            printf '%s\n' "${staged_files}"
            exit 1
          fi

          git diff --cached --check
          git commit -m "chore(data): sync MoonCat names"
          git push origin "HEAD:${GITHUB_REF_NAME}"
